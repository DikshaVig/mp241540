{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="content-card">
        <div class="card-title-group" style="justify-content: center; flex-direction: column; text-align: center;">
            <i class="bi bi-person-plus-fill" style="font-size: 2.5rem; color: var(--primary-blue);"></i>
            <span style="font-size: 1.5rem; margin-top: 0.5rem;">Create an Account</span>
            <p style="font-size: 0.875rem; color: var(--text-muted); font-weight: 400; margin-top: 4px;">
                Enter your details to register for the system
            </p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullname" class="form-control" placeholder="e.g. John Doe" required>
                </div>
                
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. john@example.com" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="submit-btn" style="grid-column: auto;">Register Account</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: var(--primary-blue); font-weight: 600; text-decoration: none;">
                Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
