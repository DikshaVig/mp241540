{% extends 'base.html' %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="content-card">
        <div class="card-title-group" style="justify-content: center; flex-direction: column; text-align: center;">
            <i class="bi bi-box-arrow-in-right" style="font-size: 2.5rem; color: var(--primary-blue);"></i>
            <span style="font-size: 1.5rem; margin-top: 0.5rem;">Welcome Back</span>
            <p style="font-size: 0.875rem; color: var(--text-muted); font-weight: 400; margin-top: 4px;">
                Sign in to access your customer analytics portal
            </p>
        </div>

        <form action="{{ url_for('login') }}" method="POST">
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="e.g. john@example.com" required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label>Password</label>
                    </div>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="submit-btn" style="grid-column: auto;">Sign In</button>
            </div>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            Don't have an account? 
            <a href="{{ url_for('register') }}" style="color: var(--primary-blue); font-weight: 600; text-decoration: none;">
                Create one
            </a>
        </div>
    </div>
</div>
{% endblock %}
